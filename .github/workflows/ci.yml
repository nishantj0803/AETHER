name: Aether Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-suite:
    name: Python Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/demo_service/requirements.txt
          pip install pytest httpx asyncpg pydantic prometheus-client opentelemetry-api

      - name: Run Full Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

  go-collector-build:
    name: Go Ingestion Collector Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/go_collector/go.sum

      - name: Verify Go Collector Build & Run Tests
        working-directory: services/go_collector
        run: |
          go vet ./...
          go test -v -bench=. ./...
          go build -v -o /dev/null ./...

  docker-compose-validate:
    name: Docker Compose Syntax & Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
