global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "demo-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["demo-service:8000"]

  - job_name: "go-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["go-collector:9102"]

