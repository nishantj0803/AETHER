apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-go-collector
  namespace: aether-system
  labels:
    app: aether-go-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aether-go-collector
  template:
    metadata:
      labels:
        app: aether-go-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: go-collector
        image: aether/go-collector:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9102
          name: metrics
        env:
        - name: KAFKA_BROKERS
          value: "redpanda.aether-system.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "telemetry.logs"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aether-db-secret
              key: dsn
        - name: WORKER_COUNT
          value: "8"
        - name: BATCH_SIZE
          value: "250"
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
